<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Account</title>
    <link href='https://fonts.googleapis.com/css?family=Roboto Mono' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/styleTopBarSideBar.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="margin:0px;padding:0px;">

<!-- Topbar -->
<div th:if="${#authorization.expression('isAuthenticated()')}">
    <div th:replace="~{fragments/topbars :: topbar-signed}"></div>
</div>
<div th:unless="${#authorization.expression('isAuthenticated()')}">
    <div th:replace="~{fragments/topbars :: topbar-guest}"></div>
</div>

<div class="page-container" style="display: flex; min-height: 100vh;">
    <!-- Sidebar -->
    <div th:insert="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main content -->
    <div class="main-content" style="padding: 20px; margin-left: 5%;">

        <h1>Settings page</h1>

        <div class="d-flex col-12">
            <div class="col-6 m-1 mt-3">
                <h2>Change Password</h2>
                <br>
                <form action="/users/updatePW" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Password -->
                    <div class="mb-3">
                        <input type="text" class="form-control vw-50" id="password" name="password"
                               placeholder="New Password" required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <input type="text" class="form-control vw-50" id="cpassword" name="cpassword"
                               placeholder="Password you entered above" required>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-warning"><i class=""></i> Submit</button>
                        <a href="javascript:history.back()" class="btn" style="background-color: #fcc907;">Cancel</a>
                    </div>
                </form>
            </div>

            <div class="col-6 m-1 mt-3">
                <h2>Delete Account</h2>
                <br>
                <form action="/users/deleteAccount" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Password -->
                    <div class="mb-3">
                        <input type="text" class="form-control vw-50" id="password" name="password"
                               placeholder="current password" required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <input type="text" class="form-control vw-50" id="cpassword" name="cpassword"
                               placeholder="current password" required>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-warning"><i class=""></i> Submit</button>
                        <a href="javascript:history.back()" class="btn" style="background-color: #fcc907;">Cancel</a>
                    </div>
                </form>
            </div>

        </div>

<!--        <div class="empty-div"></div>-->

    </div>
</div>

<!-- Profile Dropdown Script -->
<script src="/js/dropdown-script.js"></script>

</body>
</html>
