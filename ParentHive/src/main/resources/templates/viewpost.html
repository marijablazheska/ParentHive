<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Post</title>
    <link href='https://fonts.googleapis.com/css?family=Roboto Mono' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link href="/css/styleTopBarSideBar.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<!-- Topbar -->
<div th:if="${#authorization.expression('isAuthenticated()')}">
    <div th:replace="~{fragments/topbars :: topbar-signed}"></div>
</div>
<div th:unless="${#authorization.expression('isAuthenticated()')}">
    <div th:replace="~{fragments/topbars :: topbar-guest}"></div>
</div>

<div th:if="${reportSuccess == true}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${reportMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div th:if="${reportSuccess == false}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${reportMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="page-container" style="display: flex; min-height: 100vh;">
    <!-- Sidebar -->
    <div th:insert="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="main-content flex row" style="padding: 20px;">
        <div class="posts-list col-8">
            <div th:replace="fragments/postbox :: postbox(${post}, ${false})"></div>

            <!-- Hidden data for AI summary -->
            <span id="postTitle" th:text="${post.title}" style="display:none;"></span>
            <textarea id="postContent" th:text="${post.content}" style="display:none;"></textarea>

            <!-- AI summary -->
            <div class="card p-3 mt-3 mb-4 shadow-sm"
                 style="position: relative; z-index: 999;">

                <div class="d-flex justify-content-between align-items-center">

                    <h5 class="mb-0">
                        <i class="bi bi-stars"></i>
                        AI Summary
                    </h5>

                    <button class="btn btn-warning"
                            id="generateSummaryButton"
                            onclick="event.stopPropagation(); generateSummary();">
                        Generate Summary
                    </button>

                </div>

                <div id="summaryBox" class="mt-3 text-secondary">
                    No summary generated yet.
                </div>
            </div>

            <!----------------------------------------------------------------------->

            <h2 class="m-5 mb-3 text-center text-secondary">All echoes</h2>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <div class="card p-3 m-1" id="replyBox" style="display: none">
                <div class="container mt-4">
                    <form th:action="@{'/posts/addReply/' + ${postId}}" method="post">
                        <div class="mb-3">
                                <textarea class="form-control" id="replyContent" name="Content" rows="6"
                                          placeholder="What do you echo?" required></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning">
                                <i class="far fa-comment stats-icon"></i> Echo
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="m-3 mb-3" th:each="reply : ${replies}">
                <!-- Hidden span carries reply text for AI summary -->
                <span class="reply-content" th:text="${reply.content}" style="display:none;"></span>
                <div th:replace="fragments/postbox :: replybox(${reply})"></div>
            </div>
        </div>

        <div class="col-3">
            <div th:replace="fragments/misc-components :: userbox(${post.user})"></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/dropdown-script.js"></script>

</body>

<script>
    function toggleVisibility(id, buttonId) {
        event.stopPropagation();
        const element = document.getElementById(id);
        const btnElement = document.getElementById(buttonId);
        if (element.style.display === 'none' || element.style.display === '') {
            element.style.display = 'block';
        } else {
            element.style.display = 'none';
        }
        btnElement.style.display = 'none';
    }

    document.addEventListener('click', function (e) {
        if (e.target.tagName === 'A') {
            e.stopPropagation();
        }
    }, true);

    async function generateSummary() {
        const generateButton = document.getElementById("generateSummaryButton");
         const title   = document.getElementById("postTitle").textContent.trim();
         const content = document.getElementById("postContent").value.trim();

        // Collect all reply texts from the page
        const replyNodes = document.querySelectorAll(".reply-content");
        const replies = Array.from(replyNodes)
            .map((el, i) => "Reply " + (i + 1) + ": " + el.textContent.trim())
            .join("\n");

        const fullText = "Title: " + title
            + "\n\nPost:\n" + content
            + (replies ? "\n\nReplies:\n" + replies : "");

        const summaryBox = document.getElementById("summaryBox");
        summaryBox.textContent = "Generating summary...";
        if (generateButton) {
            generateButton.disabled = true;
        }

        const csrfToken  = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        try {
            const response = await fetch("/api/ai/summarize", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({ postContent: fullText })
            });

            if (!response.ok) {
                if (response.status === 429) {
                    const retryAfterHeader = response.headers.get("Retry-After");
                    const retrySeconds = retryAfterHeader ? parseInt(retryAfterHeader, 10) : 60;
                    startCooldown(Math.max(5, isNaN(retrySeconds) ? 60 : retrySeconds));
                } else if (response.status === 503) {
                    summaryBox.textContent = "AI summary is not configured.";
                    if (generateButton) {
                        generateButton.disabled = false;
                    }
                } else {
                    summaryBox.textContent = "Failed to generate summary (server error " + response.status + ").";
                    if (generateButton) {
                        generateButton.disabled = false;
                    }
                }
                return;
            }

            summaryBox.textContent = await response.text();
            if (generateButton) {
                generateButton.disabled = false;
            }

        } catch (error) {
            summaryBox.textContent = "Failed to generate summary.";
            console.error(error);
            if (generateButton) {
                generateButton.disabled = false;
            }
        }
    }

    function startCooldown(seconds) {
        const summaryBox = document.getElementById("summaryBox");
        const generateButton = document.getElementById("generateSummaryButton");
        let remaining = seconds;
        summaryBox.textContent = "Too many requests. Try again in " + remaining + "s.";
        if (generateButton) {
            generateButton.disabled = true;
        }
        if (window.summaryCooldownTimer) {
            clearInterval(window.summaryCooldownTimer);
        }
        window.summaryCooldownTimer = setInterval(() => {
            remaining -= 1;
            if (remaining <= 0) {
                clearInterval(window.summaryCooldownTimer);
                window.summaryCooldownTimer = null;
                summaryBox.textContent = "You can generate a summary again.";
                if (generateButton) {
                    generateButton.disabled = false;
                }
                return;
            }
            summaryBox.textContent = "Too many requests. Try again in " + remaining + "s.";
        }, 1000);
    }
</script>

</html>
