<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:fragment="postbox(post, shortDisplay)" th:onclick="'location.href=\'/posts/' + ${post.id} + '\''" class="flex card p-3 m-1 w-100 col-12"
     th:style="${post.post_level == 2} ? 'border-left: 10px solid rgba(41, 76, 140, 0.5);'
     : (${post.post_level == 1} ? 'border-left: 10px solid rgba(68, 141, 102, 0.5);'
     : 'border-left: 10px solid rgba(255, 107, 0, 0.5);')"
     th:title="${post.post_level == 2} ? 'This post has been made by a child-care professional.'
     : (${post.post_level == 1} ? 'This post contains a linked study.'
     : '' )">
    <div class="d-flex align-items-center justify-content-between mb-3 w-100">
        <div class="d-flex align-items-center">
            <!-- Profile Image -->
            <img src="https://placehold.co/40x40/cccccc/333333?text=User" alt="Profile" class="profile-img me-2">
            <div>
                <!-- Username -->
                <div class="username" th:text="${post.user.username}"></div>
                <!-- Time Ago -->
                <div class="time-ago" th:text="${post.date}"></div>
            </div>
        </div>
        <!-- Three dots icon for options -->
        <i class="fas fa-ellipsis-h stats-icon"></i>
    </div>

    <!-- Post Title -->
    <h2 class="post-title" th:text="${post.title}"></h2>

    <!-- Post Content -->
    <p class="post-content" th:utext="${shortDisplay ? (post.content.length() <= 100 ? post.content : post.content.substring(1, 99)+'...' ) : post.content}"></p>

    <!-- Tags and Stats Section -->
    <div class="d-flex justify-content-between align-items-center flex-wrap">
        <!-- Tags -->
        <div>
            <span class="tag-badge text-primary" th:text="${'['+post.category+']'}"></span>
            <span class="text-primary" th:utext="${post.post_level == 2} ? '<br><i class=\'bi bi-briefcase-fill\'></i>Post by professional bee.'
             : (${post.post_level == 1} ? '<br><i class=\'bi bi-link\'></i>Contains linked study.'
             : '')"></span>
            <br>
            <span class="tag-badge text-secondary" th:text="${shortDisplay ? 'Read more...' : ''}"></span>
        </div>
        <!-- Stats (Comments, Upvotes, Downvotes) -->
        <div class="d-flex align-items-center mt-2 mt-sm-0">
            <!-- Upvotes hasn't liked -->
            <div th:if="${user != null && !user.upVotedPosts.contains(post.id)}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/upvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Upvote post">
                        <i class="bi bi-heart"></i>
                        <span class="stats-number" th:text="${post.upvote}"></span>
                    </button>
                </form>
            </div>
            <!-- Upvotes has liked -->
            <div th:if="${user != null && user.upVotedPosts.contains(post.id)}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/upvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Upvote post">
                        <i class="bi bi-heart-fill"></i>
                        <span class="stats-number" th:text="${post.upvote}"></span>
                    </button>
                </form>
            </div>
            <!-- Downvotes hasn't disliked -->
            <div th:if="${user != null && !user.downVotedPosts.contains(post.id)}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/downvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Downvote post">
                        <i class="bi bi-heartbreak"></i>
                        <span class="stats-number" th:text="${post.downvote}"></span>
                    </button>
                </form>
            </div>
            <!-- Downvotes has disliked -->
            <div th:if="${user != null && user.downVotedPosts.contains(post.id)}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/downvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Downvote post">
                        <i class="bi bi-heartbreak-fill"></i>
                        <span class="stats-number" th:text="${post.downvote}"></span>
                    </button>
                </form>
            </div>
            <!-- Comments -->
            <div class="Interaction">
                <button onclick="toggleVisibility('replyBox', 'replyBoxButton')" class="Interaction-Button" title="Reply with suggestion">
                    <i class="far fa-comment stats-icon"></i>
                    <span class="stats-number" th:text="${post.replies.size()}"></span>
                </button>
            </div>
            <!-- Save post not saved-->
            <div th:if="${user != null && !user.SavedPosts.contains(post.id)}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/savePost'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Save post">
                        <i class="bi bi-bookmark"></i>
                    </button>
                </form>
            </div>
            <!-- Save post saved-->
            <div th:if="${user != null && user.SavedPosts.contains(post.id)}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/savePost'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Save post">
                        <i class="bi bi-bookmark-fill"></i>
                    </button>
                </form>
            </div>
            <!-- Repost user has reposted alr-->
            <div th:if="${user != null && user.repostedPosts.contains(post.id)}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/repost'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Repost">

                        <i class="bi bi-share-fill"></i>
                        <span th:text="${post.repost}">0</span>
                    </button>
                </form>
            </div>
            <!-- Repost user hasn't reposted-->
            <div th:if="${user != null && user.repostedPosts.contains(post.id) == false}" class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/repost'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Repost">
                        <i class="bi bi-share"></i>
                        <span th:text="${post.repost}">0</span>
                    </button>
                </form>
            </div>
            <!-- Report -->
            <div class="Interaction">
                <form th:action="@{'/posts/' + ${post.id} + '/report'}" method="GET">
                    <button type="submit" class="Interaction-Button text-warning" title="Report post">
                        <i class="fa-solid fa-flag"></i>
                    </button>
                </form>
            </div>

            <!-- Edit -->
            <div th:if="${user != null && post.getUser().getId() == user.getId()}" class="Interaction">
                <form th:action="@{'/editPost/' + ${post.id}}" method="get">
                    <button type="submit" class="Interaction-Button text-primary" title="Edit your post">
                        <i class="fas fa-edit"></i>
                    </button>
                </form>
            </div>

            <!-- Delete -->
            <div th:if="${user != null && post.getUser().getId() == user.getId()}" class="Interaction">
                <button type="button" class="Interaction-Button text-primary" title="Delete your post"
                    onclick="if(event) event.stopPropagation(); if(confirm('Are you sure you want to delete this post?')) document.getElementById('deletePostForm').submit(); return false;">
                    <i class="fa fa-trash"></i>
                </button>
                <form id="deletePostForm" th:action="@{'/deletePost/' + ${post.id}}" method="post" style="display: none;">
                </form>
            </div>
        </div>
    </div>

</div>

<div th:fragment="replybox(reply)" class="card p-3 m-1"
     th:style="${reply.post_level == 2} ? 'border-left: 10px solid rgba(41, 76, 140, 0.5);'
     : (${reply.post_level == 1} ? 'border-left: 10px solid rgba(68, 141, 102, 0.5);'
     : 'border-left: 10px solid rgba(255, 107, 0, 0.5);')"
     th:title="${reply.post_level == 2} ? 'This suggestion has been made by a child-care professional.'
     : (${reply.post_level == 1} ? 'This suggestion contains a linked study.'
     : '' )">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center">
            <!-- Profile Image -->
            <img src="https://placehold.co/40x40/cccccc/333333?text=User" alt="Profile" class="profile-img me-2">
            <div>
                <!-- Username -->
                <div class="username" th:text="${reply.user.username}"></div>
                <!-- Time Ago -->
                <div class="time-ago" th:text="${reply.date}"></div>
            </div>
        </div>
        <!-- Three dots icon for options -->
        <i class="fas fa-ellipsis-h stats-icon"></i>
    </div>

    <!-- Post Content -->
    <p class="post-content" th:text="${reply.content}"></p>

    <!-- Tags and Stats Section -->
    <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div>
            <span class="text-primary" th:utext="${reply.post_level == 2} ? '<br><i class=\'bi bi-briefcase-fill\'></i>Suggestion by a professional bee.'
             : (${reply.post_level == 1} ? '<br><i class=\'bi bi-link\'></i>Contains linked study.'
             : '')"></span>
        </div>
        <!-- Stats (Comments, Upvotes, Downvotes) -->
        <div class="d-flex align-items-center mt-2 mt-sm-0">
            <!-- Upvote hasn't upvoted -->
            <div th:if="${user != null && !user.upVotedReplies.contains(reply.id)}" class="Interaction">
                <form th:action="@{'/replies/' + ${reply.id} + '/upvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Upvote suggestion">
                        <i class="bi bi-heart"></i>
                        <span th:text="${reply.upvote}">0</span>
                    </button>
                </form>
            </div>
            <!-- Upvote has upvoted -->
            <div th:if="${user != null && user.upVotedReplies.contains(reply.id)}" class="Interaction">
                <form th:action="@{'/replies/' + ${reply.id} + '/upvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Upvote suggestion">
                        <i class="bi bi-heart-fill"></i>
                        <span th:text="${reply.upvote}">0</span>
                    </button>
                </form>
            </div>

            <!-- Downvote hasn't downvoted-->
            <div th:if="${user != null && !user.downVotedReplies.contains(reply.id)}" class="Interaction">
                <form th:action="@{'/replies/' + ${reply.id} + '/downvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Downvote suggestion">
                        <i class="bi bi-heartbreak"></i>
                        <span th:text="${reply.downvote}">0</span>
                    </button>
                </form>
            </div>
            <!-- Downvote has downvoted-->
            <div th:if="${user != null && user.downVotedReplies.contains(reply.id)}" class="Interaction">
                <form th:action="@{'/replies/' + ${reply.id} + '/downvote'}" method="post">
                    <button type="submit" class="Interaction-Button" title="Downvote suggestion">
                        <i class="bi bi-heartbreak-fill"></i>
                        <span th:text="${reply.downvote}">0</span>
                    </button>
                </form>
            </div>

            <!-- Report -->
            <div class="Interaction">
                <form th:action="@{'/posts/' + ${reply.id} + '/report'}" method="GET">
                    <button type="submit" class="Interaction-Button text-warning" title="Report suggestion">
                        <i class="fa-solid fa-flag"></i>
                    </button>
                </form>
            </div>

            <!-- Edit -->
            <div th:if="${user != null && reply.getUser().getId() == user.getId()}" class="Interaction">
                <form th:action="@{'/replies/edit/' + ${reply.id}}" method="get">
                    <button type="submit" class="Interaction-Button text-primary" title="Edit your suggestion">
                        <i class="fas fa-edit"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>

</body>
</html>
