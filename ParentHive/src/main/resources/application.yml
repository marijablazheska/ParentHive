## Comment below when testing and uncomment app properties
logging:
  level:
    org:
      springframework:
        web: DEBUG

gemini:
  api:
    key: ${GEMINI_API_KEY}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.SQLServer2012Dialect

server:
  port: 8080
